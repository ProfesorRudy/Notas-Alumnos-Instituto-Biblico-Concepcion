<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal del Alumno · Instituto Bíblico Concepción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DESIGN TOKENS
   ===================================================================== */
:root {
  --blue-50:  #eef4fc;
  --blue-100: #dce7f7;
  --blue-400: #4574c4;
  --blue-500: #2f5da3;
  --blue-600: #234a85;
  --blue-700: #1a3866;
  --ink-900: #0f172a;
  --ink-800: #1e293b;
  --ink-700: #334155;
  --ink-500: #64748b;
  --ink-400: #94a3b8;
  --ink-300: #cbd5e1;
  --surface: #ffffff;
  --surface-soft: #f8fafc;
  --surface-sunk: #eef2f7;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --success-bg: #e6f9f0; --success: #17915a;
  --danger-bg:  #fdeeee; --danger:  #c8392f;
  --warn-bg:    #fff6e0; --warn:    #b9740f;
  --info-bg:    #eaf1ff; --info:    #2b6cb0;
  --violet-bg:  #f3e8ff; --violet:  #7c3aed;
  --sidebar-bg: linear-gradient(165deg, #0a1730 0%, #132a4d 55%, #1b3663 100%);
  --sidebar-text: rgba(255,255,255,.66);
  --sidebar-text-strong: #ffffff;
  --sidebar-accent: #63a4ff;
  --sidebar-accent-strong: #8fc0ff;
  --sidebar-active-bg: linear-gradient(90deg, rgba(99,164,255,.24), rgba(99,164,255,.09));
  --sidebar-hover-bg: rgba(99,164,255,.12);
  --sidebar-border: rgba(255,255,255,.08);
  --radius-xs: 8px; --radius-sm: 10px; --radius-md: 14px; --radius-lg: 20px; --radius-xl: 26px;
  --shadow-xs: 0 1px 2px rgba(15,23,42,.05);
  --shadow-sm: 0 3px 10px -2px rgba(15,23,42,.08);
  --shadow-md: 0 10px 28px -8px rgba(15,23,42,.14);
  --shadow-lg: 0 24px 55px -16px rgba(15,23,42,.22);
  --shadow-xl: 0 40px 90px -24px rgba(15,23,42,.30), 0 10px 26px -10px rgba(15,23,42,.14);
  --ease: cubic-bezier(.4,0,.2,1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: radial-gradient(1100px 600px at 50% -10%, #f7fafd 0%, #eef2f7 55%, #e8edf3 100%);
  color: var(--ink-900);
  min-height: 100vh;
  padding: 2rem 1rem;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 640px; margin: 0 auto; transition: max-width .3s var(--ease); }
body.logged-in .container { max-width: 1060px; }

.header { text-align: center; margin-bottom: 1.75rem; transition: margin .25s var(--ease); }
.header img { width: 160px; height: 160px; object-fit: contain; margin-bottom: 0.6rem; transition: width .25s var(--ease), height .25s var(--ease); }
.header h1 { font-size: 1.45rem; color: var(--ink-900); font-weight: 800; margin-bottom: 0.2rem; letter-spacing: -0.01em; }
.header .sub1 { color: var(--ink-400); font-size:0.76rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:0.15rem; font-weight: 600; }
.header .sub2 { font-size: 0.9rem; color: var(--ink-500); }
body.logged-in .header { margin-bottom: 1.1rem; }
body.logged-in .header img { width: 84px; height: 84px; }
body.logged-in .header h1 { font-size: 1.18rem; }

.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 2.1rem 1.9rem 1.9rem;
  box-shadow: var(--shadow-xl), inset 0 1px 0 rgba(255,255,255,.7);
  overflow: hidden;
}
.card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--blue-400), var(--blue-600), var(--blue-400));
  background-size: 200% 100%;
}
.login-eyebrow {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
  color: var(--blue-600); margin-bottom: 0.55rem;
}
label { display: block; font-size: 0.85rem; color: var(--ink-700); margin-bottom: 8px; font-weight: 600; }
.input-row { display: flex; gap: 9px; }
.input-wrap { position: relative; flex: 1; min-width: 0; }
.input-wrap .input-icon {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  color: var(--ink-400); display: flex; pointer-events: none; transition: color .18s var(--ease);
}
.input-wrap .input-icon svg { width: 18px; height: 18px; }
.input-wrap:focus-within .input-icon { color: var(--blue-500); }
input[type=text] {
  width: 100%; padding: 12px 15px 12px 40px; border: 1.5px solid var(--border-strong); border-radius: var(--radius-sm);
  font-size: 0.98rem; font-family: inherit; font-weight: 600; letter-spacing: 0.02em; color: var(--ink-900);
  outline: none; transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
  background: var(--surface-soft);
}
input[type=text]::placeholder { font-weight: 500; color: var(--ink-300); }
input[type=text]:focus { border-color: var(--blue-400); box-shadow: 0 0 0 4px rgba(69,116,196,.16); background: var(--surface); }
input[type=text].input-invalid { border-color: #eab3ac; }
button {
  position: relative; padding: 11px 20px; background: linear-gradient(180deg, var(--blue-400), var(--blue-500));
  color: #fff; border: none; border-radius: var(--radius-sm); font-family: inherit; font-size: 0.9rem;
  cursor: pointer; font-weight: 700; white-space: nowrap; transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease), filter .15s var(--ease);
  box-shadow: var(--shadow-sm);
}
button:hover { background: linear-gradient(180deg, var(--blue-500), var(--blue-600)); transform: translateY(-2px); box-shadow: var(--shadow-md); }
button:active { transform: translateY(0); filter: brightness(.97); }
button:disabled { cursor: default; transform: none !important; }
#btn-ingresar { display: inline-flex; align-items: center; justify-content: center; min-width: 118px; }
#btn-ingresar .btn-idle { display: inline-flex; align-items: center; gap: 7px; }
#btn-ingresar .btn-idle svg { width: 15px; height: 15px; transition: transform .18s var(--ease); }
#btn-ingresar:hover .btn-idle svg { transform: translateX(2px); }
#btn-ingresar .btn-loading { display: none; align-items: center; gap: 8px; }
#btn-ingresar.is-loading .btn-idle { display: none; }
#btn-ingresar.is-loading .btn-loading { display: inline-flex; }
#btn-ingresar.is-loading { background: linear-gradient(180deg, var(--blue-500), var(--blue-600)); box-shadow: var(--shadow-sm); }
.spinner {
  width: 15px; height: 15px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.45); border-top-color: #fff;
  animation: spin .65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error {
  display: none; align-items: flex-start; gap: 9px;
  background: var(--danger-bg); border: 1px solid #f6c9c5; border-radius: var(--radius-sm);
  padding: 11px 13px; font-size: 0.84rem; color: var(--danger); margin-top: 12px; line-height: 1.45;
}
.error .error-icon { flex-shrink: 0; margin-top: 1px; }
.error .error-icon svg { width: 16px; height: 16px; }
.hint { font-size: 0.76rem; color: var(--ink-400); text-align: center; margin-top: 16px; line-height: 1.5; letter-spacing: 0.01em; }

/* =====================================================================
   DASHBOARD SHELL
   ===================================================================== */
#vista-panel { display: none; }
.dashboard-shell {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.dashboard-topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--border);
  background: var(--surface-soft);
}
.avatar {
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(160deg, var(--blue-100), #b9d0ee);
  color: var(--blue-700); display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(35,74,133,.18);
}
.alumno-nombre { font-size: 1rem; font-weight: 700; color: var(--ink-900); line-height: 1.25; }
.alumno-rut { font-size: 0.79rem; color: var(--ink-400); margin-top: 1px; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: var(--radius-xs);
  background: var(--surface); border: 1px solid var(--border-strong); color: var(--ink-500);
  cursor: pointer; transition: all .15s var(--ease); box-shadow: none;
}
.icon-btn:hover { color: var(--blue-600); border-color: var(--blue-400); background: var(--blue-50); transform: none; box-shadow: var(--shadow-xs); }
.icon-btn svg { width: 17px; height: 17px; }
.btn-salir {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); color: var(--ink-500); border: 1px solid var(--border-strong);
  font-size: 0.78rem; font-weight: 600; padding: 8px 13px; border-radius: var(--radius-xs); box-shadow: none;
}
.btn-salir svg { width: 15px; height: 15px; }
.btn-salir:hover { background: var(--danger-bg); color: var(--danger); border-color: #f3c9c3; transform: none; box-shadow: none; }

.app-shell { display: flex; align-items: stretch; min-height: 480px; }

/* ---- Sidebar / nav ---- */
.sidebar {
  width: 250px; flex-shrink: 0; background: var(--sidebar-bg);
  display: flex; flex-direction: column; gap: 4px; padding: 1rem 0.85rem;
  transition: width .22s var(--ease), padding .22s var(--ease);
}
.sidebar.collapsed { width: 72px; padding: 1rem 0.6rem; }
.sidebar-toggle {
  align-self: flex-end; display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: var(--radius-xs); margin-bottom: 8px;
  background: transparent; border: 1px solid var(--sidebar-border); color: var(--sidebar-text);
  cursor: pointer; transition: all .18s var(--ease); box-shadow: none;
}
.sidebar-toggle:hover { background: var(--sidebar-hover-bg); color: #fff; transform: none; box-shadow: none; }
.sidebar-toggle svg { width: 15px; height: 15px; transition: transform .22s var(--ease); }
.sidebar.collapsed .sidebar-toggle { align-self: center; }
.sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

.nav-list { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 10px 12px; border-radius: var(--radius-sm); border: none; background: transparent;
  color: var(--sidebar-text); font-family: inherit; font-size: 0.85rem; font-weight: 600;
  text-align: left; cursor: pointer; transition: background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
  box-shadow: none; position: relative;
}
.nav-item:hover { background: var(--sidebar-hover-bg); color: var(--sidebar-text-strong); transform: translateX(2px); box-shadow: none; }
.nav-item.active {
  background: var(--sidebar-active-bg); color: var(--sidebar-accent-strong); font-weight: 700;
  box-shadow: inset 3px 0 0 var(--sidebar-accent), 0 4px 14px -6px rgba(99,164,255,.45);
}
.nav-item.active:hover { transform: none; }
.nav-item svg { width: 19px; height: 19px; flex-shrink: 0; }
.nav-item .nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 10px; }
.sidebar.collapsed .nav-item .nav-label { display: none; }
.nav-exit {
  display: none; /* the topbar already exposes Salir; kept for potential future use */
}

/* ---- Main content ---- */
.main-content { flex: 1; min-width: 0; padding: 1.6rem; background: var(--surface); overflow-x: hidden; }

@media (min-width: 769px) {
  .sidebar-toggle { display: inline-flex; }
}
@media (max-width: 768px) {
  .app-shell { flex-direction: column; }
  .sidebar {
    width: 100% !important; padding: .85rem; background: var(--surface-soft);
    border-bottom: 1px solid var(--border);
  }
  .sidebar-toggle { display: none; }
  .nav-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .nav-item {
    flex-direction: column; gap: 6px; padding: 10px 4px; text-align: center; min-width: 0;
    color: var(--ink-500); background: var(--surface); border: 1px solid var(--border);
    font-size: 0.68rem; line-height: 1.2; box-shadow: var(--shadow-xs);
  }
  .nav-item svg { width: 20px; height: 20px; }
  .nav-item .nav-label { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: break-word; }
  .nav-item:hover { background: var(--blue-50); color: var(--blue-600); border-color: var(--blue-400); }
  .nav-item.active { background: var(--blue-100); color: var(--blue-700); border-color: var(--blue-400); box-shadow: none; }
  .main-content { padding: 1.1rem .95rem; }
}

/* =====================================================================
   Cards & content components
   ===================================================================== */
.curso-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 1.25rem 1.3rem; margin-bottom: 16px; box-shadow: var(--shadow-xs);
  transition: box-shadow .18s var(--ease), border-color .18s var(--ease);
}
.curso-card:hover { box-shadow: var(--shadow-sm); border-color: var(--border-strong); }
.curso-titulo { display:flex; align-items:center; gap:9px; font-size: 1rem; font-weight: 700; color: var(--ink-900); margin-bottom: 1rem; letter-spacing: -0.005em; }
.curso-titulo svg { width: 18px; height: 18px; color: var(--blue-600); flex-shrink: 0; }
.curso-badge { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 3px 11px; border-radius: 99px; background: var(--blue-100); color: var(--blue-700); }

/* Asistencia */
.asistencia-summary {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface-soft); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 13px 17px; margin-bottom: 12px;
}
.asistencia-pct { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
.asistencia-log { display: flex; flex-wrap: wrap; gap: 7px; }
.asistencia-chip {
  font-size: 0.73rem; font-weight: 600; padding: 6px 11px; border-radius: var(--radius-xs);
  display: flex; flex-direction: column; align-items: center; min-width: 66px; gap: 2px;
  border: 1px solid transparent;
}
.asistencia-chip .fecha { font-size: 0.66rem; font-weight: 500; opacity: 0.72; }
.asistencia-chip .chip-row { display: flex; align-items: center; gap: 4px; }
.asistencia-chip svg { width: 13px; height: 13px; flex-shrink: 0; }
.presente { background: var(--success-bg); color: var(--success); }
.ausente { background: var(--danger-bg); color: var(--danger); }
.atraso { background: var(--warn-bg); color: var(--warn); }
.media-clase { background: #e3f6fa; color: #0d7f95; }

/* Observaciones y Avisos (lista general) */
.aviso-item {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 13px 15px; margin-bottom: 11px; transition: box-shadow .18s var(--ease), border-color .18s var(--ease);
}
.aviso-item:hover { box-shadow: var(--shadow-sm); border-color: var(--border-strong); }
.aviso-fecha {
  font-size: 0.71rem; color: var(--ink-400); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 5px; display: flex; align-items: center; gap: 6px;
}
.aviso-fecha svg { width: 13px; height: 13px; flex-shrink: 0; }
.aviso-titulo { font-size: 0.92rem; font-weight: 700; color: var(--ink-900); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.aviso-titulo svg { width: 15px; height: 15px; color: var(--blue-600); flex-shrink: 0; }
.aviso-texto { font-size: 0.85rem; color: var(--ink-700); line-height: 1.55; }
.sin-avisos { font-size: 0.85rem; color: var(--ink-400); text-align: center; padding: 26px 10px; }

/* Horario */
.horario-row {
  display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 13px 15px; margin-bottom: 9px; flex-wrap: wrap;
  transition: box-shadow .18s var(--ease), border-color .18s var(--ease);
}
.horario-row:hover { box-shadow: var(--shadow-sm); border-color: var(--border-strong); }
.horario-dia { font-size: 0.86rem; font-weight: 700; color: var(--ink-900); min-width: 82px; }
.horario-hora { font-size: 0.82rem; color: var(--ink-500); }
.modalidad-badge { font-size: 0.71rem; font-weight: 700; padding: 4px 11px; border-radius: 99px; margin-left: auto; }
.presencial { background: var(--info-bg); color: var(--info); }
.online { background: var(--violet-bg); color: var(--violet); }
.hibrido { background: var(--blue-100); color: var(--blue-700); }
.horario-lugar { font-size: 0.79rem; color: var(--ink-400); width: 100%; }

/* Materiales */
.material-item {
  display: flex; align-items: center; gap: 13px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 11px 15px; margin-bottom: 9px;
  transition: box-shadow .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);
}
.material-item:hover { box-shadow: var(--shadow-sm); border-color: var(--border-strong); transform: translateY(-1px); }
.material-icon {
  width: 36px; height: 36px; border-radius: var(--radius-xs); flex-shrink: 0;
  background: var(--blue-50); color: var(--blue-600); display: flex; align-items: center; justify-content: center;
}
.material-icon svg { width: 18px; height: 18px; }
.material-info { flex: 1; min-width: 0; }
.material-nombre { font-size: 0.89rem; font-weight: 600; color: var(--ink-900); }
.material-desc { font-size: 0.77rem; color: var(--ink-400); margin-top: 2px; line-height: 1.4; }
a.btn-descargar {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  background: linear-gradient(180deg, var(--blue-400), var(--blue-500)); color: #fff;
  font-size: 0.78rem; font-weight: 700; padding: 8px 15px; border-radius: 99px; white-space: nowrap;
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease);
  box-shadow: var(--shadow-xs);
}
a.btn-descargar svg { width: 14px; height: 14px; }
a.btn-descargar:hover { background: linear-gradient(180deg, var(--blue-500), var(--blue-600)); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.material-audio { align-items: flex-start; flex-direction: column; }
.material-audio audio { width: 100%; margin-top: 8px; height: 36px; }
.sin-materiales { font-size: 0.84rem; color: var(--ink-400); text-align: center; padding: 14px; }

/* Notas */
.notas-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.notas-grid-2 { grid-template-columns: repeat(2, 1fr); }
.grupo-titulo {
  font-size: 0.78rem; font-weight: 700; color: var(--ink-400); text-transform: uppercase; letter-spacing: 0.8px;
  margin: 4px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 7px;
}
.grupo-titulo svg { width: 14px; height: 14px; color: var(--blue-600); }
.grupo-titulo + .curso-card { margin-top: 0; }
.curso-card + .grupo-titulo { margin-top: 22px; }
.nota-box { background: var(--surface-soft); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 8px; text-align: center; }
.nota-label { font-size: 0.71rem; color: var(--ink-400); margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
.nota-valor { font-size: 1.5rem; font-weight: 800; color: var(--ink-900); letter-spacing: -0.02em; }
.nota-valor .pendiente { font-size: 0.85rem; color: var(--ink-300); font-weight: 500; }
.promedio-row {
  display: flex; align-items: center; justify-content: space-between; background: var(--surface-soft);
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 17px;
}
.promedio-label { font-size: 0.82rem; color: var(--ink-500); font-weight: 600; }
.promedio-valor { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
.estado-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 700; padding: 6px 14px; border-radius: 99px; }
.estado-badge svg { width: 13px; height: 13px; }
.aprobado { background: var(--success-bg); color: var(--success); }
.reprobado { background: var(--danger-bg); color: var(--danger); }
.pendiente-badge { background: var(--warn-bg); color: var(--warn); }
.nota-pie { font-size: 0.76rem; color: var(--ink-400); text-align: center; margin-top: 14px; line-height: 1.5; }

/* Contacto del profesor */
.profesor-perfil { display: flex; align-items: center; gap: 16px; margin-bottom: 1.1rem; }
.profesor-foto {
  width: 92px; height: 92px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
  background: linear-gradient(180deg, var(--blue-100), var(--blue-50)); border: 3px solid var(--surface);
  box-shadow: 0 0 0 1.5px var(--blue-100), var(--shadow-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.9rem; font-weight: 800; color: var(--blue-600);
}
.profesor-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.profesor-nombre { font-size: 1.15rem; font-weight: 800; color: var(--ink-900); }
.profesor-cargo { font-size: 0.8rem; color: var(--ink-500); margin-top: 2px; }
a.contacto-item { text-decoration: none; color: inherit; }
.contacto-item .material-icon.wsp { background: #e7f7ee; color: #1a8f4c; }
.contacto-valor { font-size: 0.95rem; font-weight: 700; color: var(--blue-600); margin-top: 2px; overflow-wrap: anywhere; }
.contacto-item .material-icon.wsp + .material-info .contacto-valor { color: #1a8f4c; }
.mensaje-form label { margin-bottom: 6px; font-size: 0.8rem; }
.mensaje-form select, .mensaje-form textarea {
  width: 100%; border: 1.5px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface-soft);
  font-family: inherit; font-size: 0.92rem; color: var(--ink-900); padding: 10px 12px; margin-bottom: 12px; outline: none;
}
.mensaje-form textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.mensaje-form select:focus, .mensaje-form textarea:focus { border-color: var(--blue-400); box-shadow: 0 0 0 4px rgba(69,116,196,.16); background: var(--surface); }
.mensaje-botones { display: flex; gap: 9px; flex-wrap: wrap; }
.mensaje-botones button { display: inline-flex; align-items: center; gap: 7px; font-size: 0.85rem; }
.mensaje-botones button svg { width: 16px; height: 16px; }
.mensaje-botones button.btn-wsp { background: linear-gradient(180deg, #25b565, #1a8f4c); }
.mensaje-botones button.btn-wsp:hover { background: linear-gradient(180deg, #1f9f58, #167a41); }
.mensaje-nota { font-size: 0.76rem; color: var(--ink-400); margin-top: 10px; line-height: 1.45; }
.mensaje-error { font-size: 0.8rem; color: #b42318; margin: -4px 0 10px; display: none; }

@media (max-width: 420px) {
  .notas-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

<div class="container">

  <div class="header">
    <img id="logo-ibc" alt="Instituto Bíblico Concepción" src="">
    <h1>Instituto Bíblico Concepción</h1>
    <p class="sub1">Interdenominacional</p>
    <p class="sub2">Portal del Alumno</p>
  </div>

  <!-- ============ VISTA: INGRESO ============ -->
  <div class="card" id="vista-login">
    <div class="login-eyebrow">Acceso alumnos</div>
    <label for="rut-input">Ingresa con tu RUT</label>
    <div class="input-row">
      <div class="input-wrap">
        <span class="input-icon ico-idcard"></span>
        <input type="text" id="rut-input" placeholder="12.345.678-9" maxlength="12" autocomplete="off" inputmode="text">
      </div>
      <button id="btn-ingresar" onclick="ingresar()">
        <span class="btn-idle">Ingresar<span class="ico-arrow"></span></span>
        <span class="btn-loading"><span class="spinner"></span>Verificando…</span>
      </button>
    </div>
    <div class="error" id="error-msg"><span class="error-icon ico-alert"></span><span class="error-text"></span></div>
    <p class="hint">Puedes escribirlo con o sin puntos, pero siempre con el guión (ej: 12.345.678-9).</p>
  </div>

  <!-- ============ VISTA: PANEL DEL ALUMNO ============ -->
  <div class="dashboard-shell" id="vista-panel">
    <div class="dashboard-topbar">
      <div class="avatar" id="avatar"></div>
      <div>
        <div class="alumno-nombre" id="alumno-nombre"></div>
        <div class="alumno-rut" id="alumno-rut-display"></div>
      </div>
      <div class="topbar-actions">
        <button class="btn-salir" onclick="salir()"><span class="ico-salir"></span>Salir</button>
      </div>
    </div>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()" title="Contraer/expandir menú" aria-label="Contraer o expandir menú"><span class="ico-toggle"></span></button>
        <nav class="nav-list">
          <button class="nav-item active" id="tab-materiales" onclick="mostrarSeccion('materiales')" title="Materias y Materiales"><span class="ico-materiales"></span><span class="nav-label">Materias y Materiales</span></button>
          <button class="nav-item" id="tab-tareas" onclick="mostrarSeccion('tareas')" title="Tareas a Realizar"><span class="ico-tareas"></span><span class="nav-label">Tareas a Realizar</span></button>
          <button class="nav-item" id="tab-trabajogrupo" onclick="mostrarSeccion('trabajogrupo')" title="Trabajo en Grupo"><span class="ico-grupo"></span><span class="nav-label">Trabajo en Grupo</span></button>
          <button class="nav-item" id="tab-notas" onclick="mostrarSeccion('notas')" title="Mis Calificaciones"><span class="ico-notas"></span><span class="nav-label">Mis Calificaciones</span></button>
          <button class="nav-item" id="tab-asistencia" onclick="mostrarSeccion('asistencia')" title="Mi Asistencia"><span class="ico-asistencia"></span><span class="nav-label">Mi Asistencia</span></button>
          <button class="nav-item" id="tab-observaciones" onclick="mostrarSeccion('observaciones')" title="Observaciones"><span class="ico-observaciones"></span><span class="nav-label">Observaciones</span></button>
          <button class="nav-item" id="tab-avisos" onclick="mostrarSeccion('avisos')" title="Avisos Generales"><span class="ico-avisos"></span><span class="nav-label">Avisos Generales</span></button>
          <button class="nav-item" id="tab-horario" onclick="mostrarSeccion('horario')" title="Horario y Modalidad"><span class="ico-horario"></span><span class="nav-label">Horario y Modalidad</span></button>
          <button class="nav-item" id="tab-profesor" onclick="mostrarSeccion('profesor')" title="Contacto del Profesor"><span class="ico-profesor"></span><span class="nav-label">Contacto del Profesor</span></button>
        </nav>
      </aside>

      <main class="main-content">
        <div id="seccion-materiales"></div>
        <div id="seccion-tareas" style="display:none;"></div>
        <div id="seccion-trabajogrupo" style="display:none;"></div>
        <div id="seccion-notas" style="display:none;"></div>
        <div id="seccion-asistencia" style="display:none;"></div>
        <div id="seccion-observaciones" style="display:none;"></div>
        <div id="seccion-avisos" style="display:none;"></div>
        <div id="seccion-horario" style="display:none;"></div>
        <div id="seccion-profesor" style="display:none;"></div>
      </main>
    </div>
  </div>

</div>

let alumnoActual = null;

/* Ignora espacios, puntos y guión: acepta 18.131.401-K, 18131401-K y 18131401K. */
function normRut(r) { return r.replace(/[\s.\-]/g, '').toUpperCase(); }
function initials(n) { return n.split(/[\s,]+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase(); }
function fmtNota(v) { return (v === null || v === undefined) ? '<span class="pendiente">Pendiente</span>' : v; }

/* Formatea el RUT mientras el alumno escribe: 12.345.678-9 */
function formatRut(valor) {
  const limpio = valor.replace(/[^0-9kK]/g, '').toUpperCase().slice(0, 9);
  if (limpio.length === 0) return '';
  if (limpio.length === 1) return limpio;
  const dv = limpio.slice(-1);
  const cuerpo = limpio.slice(0, -1);
  let cuerpoFmt = '';
  for (let i = 0; i < cuerpo.length; i++) {
    const posDesdeElFinal = cuerpo.length - i;
    cuerpoFmt += cuerpo[i];
    if (posDesdeElFinal > 1 && (posDesdeElFinal - 1) % 3 === 0) cuerpoFmt += '.';
  }
  return cuerpoFmt + '-' + dv;
}

function mostrarError(mensaje) {
  const err = document.getElementById('error-msg');
  err.querySelector('.error-text').textContent = mensaje;
  err.style.display = 'flex';
  document.getElementById('rut-input').classList.add('input-invalid');
}
function ocultarError() {
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('rut-input').classList.remove('input-invalid');
}

let ingresoEnCurso = false;
function ingresar() {
  if (ingresoEnCurso) return;
  const raw = document.getElementById('rut-input').value.trim();
  ocultarError();
  if (!raw) { mostrarError('Por favor ingresa tu RUT.'); return; }

  ingresoEnCurso = true;
  const btn = document.getElementById('btn-ingresar');
  btn.classList.add('is-loading');
  btn.disabled = true;
  /* Pequeña demora simulada para transmitir que el portal está verificando el RUT. */
  setTimeout(() => {
    procesarIngreso(raw);
    btn.classList.remove('is-loading');
    btn.disabled = false;
    ingresoEnCurso = false;
  }, 550);
}

function procesarIngreso(raw) {
  const key = Object.keys(alumnos).find(k => normRut(k) === normRut(raw));
  if (!key) {
    mostrarError('RUT no encontrado. Verifica que esté bien escrito, incluyendo el guión y el dígito verificador.');
    return;
  }
  if (alumnos[key].bloqueado) {
    mostrarError('Tu acceso al portal está temporalmente restringido. Contacta a tu profesor.');
    return;
  }
  alumnoActual = { rut: key, ...alumnos[key] };
  document.getElementById('avatar').textContent = initials(alumnoActual.nombre);
  document.getElementById('alumno-nombre').textContent = alumnoActual.nombre;
  document.getElementById('alumno-rut-display').textContent = 'RUT: ' + key;
  renderMateriales();
  renderTareas();
  renderTrabajoGrupo();
  renderNotas();
  renderAsistencia();
  renderObservaciones();
  renderAvisos();
  renderHorario();
  renderProfesor();
  document.getElementById('vista-login').style.display = 'none';
  document.getElementById('vista-panel').style.display = 'block';
  document.body.classList.add('logged-in');
  mostrarSeccion('materiales');
}

function salir() {
  alumnoActual = null;
  document.getElementById('rut-input').value = '';
  ocultarError();
  document.getElementById('vista-panel').style.display = 'none';
  document.getElementById('vista-login').style.display = 'block';
  document.body.classList.remove('logged-in');
  document.getElementById('rut-input').focus();
}

function sinCursos() { return Object.keys(alumnoActual.cursos).length === 0; }

const SIN_CURSOS_ACTIVOS = '<p class="sin-avisos">No tienes materias activas en este momento.<br>Revisa "Mis Calificaciones" para ver tus cursos finalizados.</p>';
function cursosActivos() { return Object.keys(alumnoActual.cursos).filter(c => !CURSOS_SOLO_CALIFICACIONES.includes(c)); }

function renderMateriales() {
  const cont = document.getElementById('seccion-materiales');
  if (sinCursos()) { cont.innerHTML = SIN_CURSOS; return; }
  const cursos = cursosActivos();
  if (cursos.length === 0) { cont.innerHTML = SIN_CURSOS_ACTIVOS; return; }
  let html = '';
  for (const curso of cursos) {
    const items = materiales[curso] || [];
    html += '<div class="curso-card"><div class="curso-titulo">' + ICONS.book + ' ' + curso + '</div>';
    if (items.length === 0) {
      html += '<p class="sin-materiales">Aún no hay materiales publicados para este curso.</p>';
    } else {
      for (const m of items) {
        if (m.tipo === 'audio') {
          html += '<div class="material-item material-audio">' +
            '<div class="material-icon">' + (iconos[m.tipo] || ICONS.audio) + '</div>' +
            '<div class="material-info"><div class="material-nombre">' + m.titulo + '</div>' +
            '<div class="material-desc">' + (m.desc || '') + '</div>' +
            '<audio controls src="' + m.url + '"></audio>' +
            '</div></div>';
          continue;
        }
        const esLink = m.tipo === 'link';
        const attrDescarga = esLink ? '' : ' download';
        const textoBoton = esLink ? (ICONS.external + '<span>Abrir</span>') : (ICONS.download + '<span>Descargar</span>');
        html += '<div class="material-item">' +
          '<div class="material-icon">' + (iconos[m.tipo] || ICONS.filePdf) + '</div>' +
          '<div class="material-info"><div class="material-nombre">' + m.titulo + '</div>' +
          '<div class="material-desc">' + (m.desc || '') + '</div></div>' +
          '<a class="btn-descargar" href="' + m.url + '" target="_blank" rel="noopener"' + attrDescarga + '>' + textoBoton + '</a>' +
          '</div>';
      }
    }
    html += '</div>';
  }
  cont.innerHTML = html;
}

      for (const t of items) {
        const adjunto = t.url
          ? '<a class="btn-descargar" href="' + t.url + '" target="_blank" rel="noopener" download>' + ICONS.download + '<span>Descargar</span></a>'
          : '';
        html += '<div class="aviso-item"><div class="aviso-fecha">' + ICONS.calendar + ' Fecha de entrega: ' + t.fecha + '</div>' +
          '<div class="aviso-titulo">' + t.titulo + '</div>' +
          '<div class="aviso-texto">' + (t.desc || '') + '</div>' +
          (adjunto ? '<div style="margin-top:8px;">' + adjunto + '</div>' : '') +
          '</div>';
      }
    }
    html += '</div>';
  }
  cont.innerHTML = html;
}

function renderTrabajoGrupo() {
  const cont = document.getElementById('seccion-trabajogrupo');
  if (sinCursos()) { cont.innerHTML = SIN_CURSOS; return; }
  const cursos = cursosActivos();
  if (cursos.length === 0) { cont.innerHTML = SIN_CURSOS_ACTIVOS; return; }
  let html = '';
  for (const curso of cursos) {
    const items = trabajoGrupo[curso] || [];
    html += '<div class="curso-card"><div class="curso-titulo">' + ICONS.book + ' ' + curso + '</div>';
    if (items.length === 0) {
      html += '<p class="sin-materiales">Aún no hay lecturas de trabajo en grupo para este curso.</p>';
    } else {
      for (const m of items) {
        html += '<div class="material-item">' +
          '<div class="material-icon">' + (iconos[m.tipo] || ICONS.filePdf) + '</div>' +
          '<div class="material-info"><div class="material-nombre">' + m.titulo + '</div>' +
          '<div class="material-desc">' + (m.desc || '') + '</div></div>' +
          '<a class="btn-descargar" href="' + m.url + '" target="_blank" rel="noopener" download>' + ICONS.download + '<span>Descargar</span></a>' +
          '</div>';
      }
    }
    html += '</div>';
  }
  cont.innerHTML = html;
}

function tarjetaCurso(curso, n) {
  {
    const sinTrabajo2 = (curso === "Ética del Nuevo Testamento" || curso === "Ética del A.T.");
    const disponibles = (sinTrabajo2 ? [n.t1, n.ex] : [n.t1, n.t2, n.ex]).filter(v => v !== null && v !== undefined);
    const prom = (n.notaFinal !== null && n.notaFinal !== undefined)
      ? n.notaFinal
      : (disponibles.length ? disponibles.reduce((s, v) => s + v, 0) / disponibles.length : null);
    const aprobado = prom !== null ? prom >= 60 : null;
    let promHtml, badgeHtml;
    if (prom !== null) {
      const color = aprobado ? '#1a9e5c' : '#c0392b';
      promHtml = '<span style="color:' + color + '">' + prom.toFixed(1) + ' pts</span>';
      badgeHtml = '<span class="estado-badge ' + (aprobado ? ('aprobado">' + ICONS.checkCircle + ' Aprobado') : ('reprobado">' + ICONS.xCircle + ' Reprobado')) + '</span>';
    } else {
      promHtml = '<span style="color:#aaa">Sin datos</span>';
      badgeHtml = '<span class="estado-badge pendiente-badge">En curso</span>';
    }
    return '<div class="curso-card">' +
      '<div class="curso-titulo">' + ICONS.book + ' ' + curso + '</div>' +
      '<div class="notas-grid' + (sinTrabajo2 ? ' notas-grid-2' : '') + '">' +
        '<div class="nota-box"><div class="nota-label">Trabajo 1</div><div class="nota-valor">' + fmtNota(n.t1) + '</div></div>' +
        (sinTrabajo2 ? '' : '<div class="nota-box"><div class="nota-label">Trabajo 2</div><div class="nota-valor">' + fmtNota(n.t2) + '</div></div>') +
        '<div class="nota-box"><div class="nota-label">Examen</div><div class="nota-valor">' + fmtNota(n.ex) + '</div></div>' +
      '</div>' +
      '<div class="promedio-row">' +
        '<div><div class="promedio-label">Promedio disponible</div><div class="promedio-valor">' + promHtml + '</div></div>' +
        badgeHtml +
      '</div>' +
      '</div>';
  }
}

/* Una materia se considera cursada cuando ya tiene promedio final registrado. */
function estaCursada(n) {
  return n.notaFinal !== null && n.notaFinal !== undefined;
}

function renderNotas() {
  const cont = document.getElementById('seccion-notas');
  if (sinCursos()) { cont.innerHTML = SIN_CURSOS; return; }
  const entradas = Object.entries(alumnoActual.cursos);
  const enCurso  = entradas.filter(([, n]) => !estaCursada(n));
  const cursadas = entradas.filter(([, n]) =>  estaCursada(n));
  let html = '';
  if (enCurso.length) {
    html += '<div class="grupo-titulo">' + ICONS.stack + ' En curso</div>';
    for (const [curso, n] of enCurso) html += tarjetaCurso(curso, n);
  }
  if (cursadas.length) {
    html += '<div class="grupo-titulo">' + ICONS.cap + ' Materias cursadas</div>';
    for (const [curso, n] of cursadas) html += tarjetaCurso(curso, n);
  }
  html += '<p class="nota-pie">Escala 0 – 100 pts · Nota mínima de aprobación: 60 pts · Las notas "Pendiente" aún no han sido registradas.</p>';
  cont.innerHTML = html;
}

function renderAsistencia() {
  const cont = document.getElementById('seccion-asistencia');
  if (sinCursos()) { cont.innerHTML = SIN_CURSOS; return; }
  const cursos = cursosActivos();
  if (cursos.length === 0) { cont.innerHTML = SIN_CURSOS_ACTIVOS; return; }
  const datosAlumno = asistencia[alumnoActual.rut] || {};
  let html = '';
  for (const curso of cursos) {
    const registros = datosAlumno[curso] || [];
    html += '<div class="curso-card"><div class="curso-titulo">' + ICONS.book + ' ' + curso + '</div>';
    if (registros.length === 0) {
      html += '<p class="sin-materiales">Aún no hay registros de asistencia para este curso.</p></div>';
      continue;
    }
    const puntos = registros.reduce((acc, r) => acc + (r.estado === 'Presente' ? 1 : (r.estado === 'Media clase' ? 0.5 : 0)), 0);
    const pct = Math.round((puntos / registros.length) * 100);
    const color = pct >= 75 ? '#1a9e5c' : (pct >= 50 ? '#e67e22' : '#c0392b');
    html += '<div class="asistencia-summary"><div class="promedio-label">Asistencia registrada</div>' +
      '<div class="asistencia-pct" style="color:' + color + '">' + pct + '%</div></div>' +
      '<div class="asistencia-log">';
    for (const r of registros) {
      const cls = r.estado === 'Presente' ? 'presente' : (r.estado === 'Atraso' ? 'atraso' : (r.estado === 'Media clase' ? 'media-clase' : 'ausente'));
      const icono = r.estado === 'Presente' ? ICONS.checkCircle : (r.estado === 'Atraso' ? ICONS.timer : (r.estado === 'Media clase' ? ICONS.halfCircle : ICONS.xCircle));
      html += '<div class="asistencia-chip ' + cls + '"><span class="fecha">' + r.fecha + '</span><span class="chip-row">' + icono + ' ' + r.estado + '</span></div>';
    }
    html += '</div></div>';
  }
  cont.innerHTML = html;
}

function renderObservaciones() {
  const cont = document.getElementById('seccion-observaciones');
  const registros = observaciones[alumnoActual.rut] || [];
  let html = '';
  for (const curso of Object.keys(alumnoActual.cursos)) {
    for (const o of (observacionesCurso[curso] || [])) {
      html += '<div class="aviso-item"><div class="aviso-fecha">' + o.fecha + '</div>' +
        '<div class="aviso-titulo">' + ICONS.book + ' ' + curso + '</div>' +
        '<div class="aviso-texto">' + o.texto + '</div></div>';
    }
  }
  if (registros.length === 0 && html === '') {
    cont.innerHTML = '<p class="sin-avisos">No hay observaciones publicadas por el momento.</p>';
    return;
  }
  for (const o of registros) {
    html += '<div class="aviso-item"><div class="aviso-fecha">' + o.fecha + '</div><div class="aviso-texto">' + o.texto + '</div></div>';
  }
  cont.innerHTML = html;
}

function renderAvisos() {
  const cont = document.getElementById('seccion-avisos');
  const avisosAlumno = avisos.filter(a => !a.curso || Object.keys(alumnoActual.cursos).includes(a.curso));
  if (avisosAlumno.length === 0) {
    cont.innerHTML = '<p class="sin-avisos">No hay avisos publicados por el momento.</p>';
    return;
  }
  let html = '';
  for (const a of avisosAlumno) {
    html += '<div class="aviso-item"><div class="aviso-fecha">' + a.fecha + '</div>' +
      '<div class="aviso-titulo">' + a.titulo + '</div>' +
      '<div class="aviso-texto">' + a.texto + '</div></div>';
  }
  cont.innerHTML = html;
}

function renderHorario() {
  const cont = document.getElementById('seccion-horario');
  if (sinCursos()) { cont.innerHTML = SIN_CURSOS; return; }
  const cursos = cursosActivos();
  if (cursos.length === 0) { cont.innerHTML = SIN_CURSOS_ACTIVOS; return; }
  let html = '';
  for (const curso of cursos) {
    const h = horarios[curso];
    html += '<div class="curso-card"><div class="curso-titulo">' + ICONS.book + ' ' + curso + '</div>';
    if (!h) {
      html += '<p class="sin-materiales">Aún no hay horario publicado para este curso.</p></div>';
      continue;
    }
    const modCls = h.modalidad === 'Presencial' ? 'presencial' : (h.modalidad === 'Online' ? 'online' : 'hibrido');
    html += '<div class="horario-row">' +
      '<div class="horario-dia">' + h.dia + '</div>' +
      '<div class="horario-hora">' + h.hora + '</div>' +
      '<span class="modalidad-badge ' + modCls + '">' + h.modalidad + '</span>' +
      '<div class="horario-lugar">' + h.lugar + '</div>' +
      '</div></div>';
  }
  cont.innerHTML = html;
}

function escHtml(t) { return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function wspNumero() { return profesor.whatsapp.replace(/\D/g, ''); }

function renderProfesor() {
  const cont = document.getElementById('seccion-profesor');
  const wsp = wspNumero();
  const ini = escHtml(initials(profesor.nombre));
  const foto = profesor.foto
    ? '<img src="' + escHtml(profesor.foto) + '" alt="Foto del profesor ' + escHtml(profesor.nombre) + '" onerror="this.parentNode.textContent=\'' + ini + '\'">'
    : ini;
  let html = '<div class="curso-card"><div class="profesor-perfil"><div class="profesor-foto">' + foto + '</div>' +
    '<div><div class="profesor-nombre">' + escHtml(profesor.nombre) + '</div><div class="profesor-cargo">Profesor · Instituto Bíblico Concepción</div></div></div>';
  if (wsp) {
    html += '<a class="material-item contacto-item" href="https://wa.me/' + wsp + '" target="_blank" rel="noopener">' +
      '<div class="material-icon wsp">' + ICONS.whatsapp + '</div>' +
      '<div class="material-info"><div class="material-desc">WhatsApp</div><div class="contacto-valor">' + escHtml(profesor.whatsapp) + '</div></div></a>';
  }
  if (profesor.correo) {
    html += '<a class="material-item contacto-item" href="mailto:' + profesor.correo + '">' +
      '<div class="material-icon">' + ICONS.mail + '</div>' +
      '<div class="material-info"><div class="material-desc">Correo electrónico</div><div class="contacto-valor">' + escHtml(profesor.correo) + '</div></div></a>';
  }
  html += '</div>';

  const cursos = Object.keys(alumnoActual.cursos);
  html += '<div class="curso-card mensaje-form"><div class="curso-titulo">' + ICONS.send + ' Enviar mensaje al profesor</div>';
  if (cursos.length) {
    html += '<label for="msg-curso">Curso</label><select id="msg-curso"><option value="">Consulta general</option>' +
      cursos.map(c => '<option>' + escHtml(c) + '</option>').join('') + '</select>';
  }
  html += '<label for="msg-texto">Mensaje</label><textarea id="msg-texto" placeholder="Escribe aquí tu consulta…"></textarea>' +
    '<p class="mensaje-error" id="msg-error">Escribe tu mensaje antes de enviarlo.</p><div class="mensaje-botones">';
  if (wsp) html += '<button type="button" class="btn-wsp" onclick="enviarMensaje(\'wsp\')">' + ICONS.whatsapp + '<span>Enviar por WhatsApp</span></button>';
  if (profesor.correo) html += '<button type="button" onclick="enviarMensaje(\'correo\')">' + ICONS.mail + '<span>Enviar por correo</span></button>';
  html += '</div><p class="mensaje-nota">Se abrirá WhatsApp o tu aplicación de correo con el mensaje ya escrito, incluyendo tu nombre y RUT. Solo debes confirmar el envío.</p></div>';
  cont.innerHTML = html;
}

function enviarMensaje(via) {
  const texto = document.getElementById('msg-texto').value.trim();
  const err = document.getElementById('msg-error');
  if (!texto) { err.style.display = 'block'; document.getElementById('msg-texto').focus(); return; }
  err.style.display = 'none';
  const sel = document.getElementById('msg-curso');
  const curso = sel && sel.value ? sel.value : '';
  const cuerpo = 'Hola profesor, soy ' + alumnoActual.nombre + ' (RUT ' + alumnoActual.rut + ').' +
    (curso ? '\nCurso: ' + curso : '') + '\n\n' + texto;
  if (via === 'wsp') {
    window.open('https://wa.me/' + wspNumero() + '?text=' + encodeURIComponent(cuerpo), '_blank', 'noopener');
  } else {
    const asunto = 'Consulta portal' + (curso ? ' · ' + curso : '') + ' · ' + alumnoActual.nombre;
    window.location.href = 'mailto:' + profesor.correo + '?subject=' + encodeURIComponent(asunto) + '&body=' + encodeURIComponent(cuerpo);
  }
}

document.getElementById('rut-input').addEventListener('keydown', e => { if (e.key === 'Enter') ingresar(); });
document.getElementById('rut-input').addEventListener('input', (e) => {
  const cursorAlFinal = e.target.selectionEnd === e.target.value.length;
  e.target.value = formatRut(e.target.value);
  if (cursorAlFinal) e.target.setSelectionRange(e.target.value.length, e.target.value.length);
  ocultarError();
});
</script>
